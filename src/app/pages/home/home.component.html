<div class="container home-container">
  <section class="daily-section">
    <h2 class="section-title">Ду‘а дня</h2>
    <hr class="divider">
    <app-dua-card [text]="dailyDua.textRu" [reference]="dailyDua.reference" [isMain]="true"
      [isAdded]="addedDuaIds().has(dailyDua.id)" actionText="Добавить к моим" (actionClick)="addToMyDuas(dailyDua)"
      [textAr]="dailyDua.textAr" [transcription]="dailyDua.transcription">
    </app-dua-card>
  </section>

  <div class="library-grid">
    <section class="library-section">
      <h3 class="section-title small">Ду‘а из Корана</h3>
      <hr class="divider">
      <div class="cards-list">
        @for (dua of quranDuas; track dua) {
          <app-dua-card [text]="dua.textRu" [reference]="dua.reference"
            [isAdded]="addedDuaIds().has(dua.id)" actionText="Сохранить в мои ду‘а" (actionClick)="addToMyDuas(dua)"
            [textAr]="dua.textAr" [transcription]="dua.transcription">
          </app-dua-card>
        }
      </div>
    </section>

    <section class="library-section">
      <h3 class="section-title small">Ду‘а из Сунны</h3>
      <hr class="divider">
      <div class="cards-list">
        @for (dua of sunnahDuas; track dua) {
          <app-dua-card [text]="dua.textRu" [reference]="dua.reference"
            [isAdded]="addedDuaIds().has(dua.id)" actionText="Сохранить в мои ду‘а" (actionClick)="addToMyDuas(dua)"
            [textAr]="dua.textAr" [transcription]="dua.transcription">
          </app-dua-card>
        }
      </div>
    </section>
  </div>

  <footer class="home-footer">
    developed by Alina Shakhabova <span class="heart"></span>
  </footer>
</div>

@if (isCategoryModalOpen && selectedLibraryDua) {
  <app-add-dua-modal
    [initialText]="selectedLibraryDua.textRu"
    [initialCategory]="'Р РёР·Рє'"
    (close)="closeCategoryModal()"
    (save)="saveLibraryDua($event)">
  </app-add-dua-modal>
}
