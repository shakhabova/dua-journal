<div class="container page-container">

  <div class="header-section">
    <div class="stats">
      <span class="stat-item"><strong>{{ activeCount() }}</strong> активно</span>
      <span class="stat-item"><strong>{{ answeredCount() }}</strong> отвечено</span>
    </div>
    <button class="add-btn" (click)="openModal()">+ Добавить ду‘а</button>
  </div>

  <div class="actions-row">
    @if (myDuas().length > 0) {
      <button class="filter-toggle-btn" (click)="toggleFilter()" [class.active]="isFilterOpen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M4 6h16M4 12h16M4 18h7"></path>
        </svg>
        Фильтр {{ selectedFilter() !== 'Все' ? '· ' + selectedFilter() : '' }}
      </button>
    }
  </div>

  <div class="filters-container" [class.expanded]="isFilterOpen">
    @for (cat of categories; track cat) {
      <button
        class="filter-chip"
        [class.active]="cat === selectedFilter()"
        (click)="setFilter(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <hr class="divider line-only">

  <div class="cards-list">
    @for (dua of filteredDuas(); track dua) {
      <app-dua-card
        [id]="dua.id"
        [text]="dua.text"
        [textAr]="dua.textAr"
        [transcription]="dua.transcription"
        [reference]="dua.reference"
        [category]="dua.category"
        [date]="dua.dateAdded"
        [isAnswered]="!dua.isAnswered ? false : true"
        (markAnswered)="markAnswered($event)"
        (editClicked)="openEditModal($event)"
        (deleteClicked)="deleteDua($event)"
        (unmarkAnswered)="unmarkAnswered($event)">
      </app-dua-card>
    }
  </div>

</div>

@if (isModalOpen) {
  <app-add-dua-modal
    [editMode]="isEditMode"
    [initialText]="editInitialText"
    [initialCategory]="editInitialCategory"
    (close)="closeModal()"
    (save)="saveNewDua($event)">
  </app-add-dua-modal>
}
