<div class="dua-card-container" [class.has-back]="!!textAr" (click)="toggleFlip($event)">
  <div class="dua-card-flipper" [class.is-flipped]="isFlipped">

    <!-- FRONT SIDE -->
    <div class="dua-card-face dua-card-front dua-card" [class.main-card]="isMain" [class.answered-card]="isAnswered"
      [class.animating]="isAnimating || isAnimatingAdded" [class.exporting]="isExporting">

      <div class="card-header" [class.has-dropdown]="id && !actionText">
        <span class="badge category" *ngIf="category">{{ category }}</span>

        <div class="dropdown-container" *ngIf="id && !actionText && !isExporting">
          <button class="icon-btn" (click)="toggleDropdown($event)">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <circle cx="12" cy="5" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="12" cy="19" r="2"></circle>
            </svg>
          </button>

          <div class="dropdown-menu" *ngIf="showDropdown">
            <button class="dropdown-item edit" (click)="onEdit()">
              <span class="icon">✎</span> Редактировать
            </button>
            <button class="dropdown-item" *ngIf="isAnswered" (click)="onUnmark()">
              <span class="icon">↺</span> Снять отметку
            </button>
            <button class="dropdown-item delete" (click)="onDelete()">
              <span class="icon">🗑</span> Удалить
            </button>
          </div>
        </div>
      </div>

      <div class="card-content">
        <p class="dua-text" [class.main-text]="isMain">{{ isMain ? '"' + text + '"' : text }}</p>
        <p class="dua-ref" *ngIf="reference">{{ reference }}</p>
        <p class="flip-hint" *ngIf="textAr && !isExporting">Нажмите, чтобы увидеть оригинал</p>
      </div>

      <div class="card-footer" *ngIf="(actionText || date || id) && !isExporting">
        <div class="left-footer" *ngIf="date">
          <span class="date">{{ date | date:'d MMM yyyy' }}</span>
        </div>

        <!-- Library / Main actions -->
        <div class="library-footer" *ngIf="actionText">
          <div class="action-wrapper">
            <button class="action-btn" *ngIf="!isAdded && !isAnimatingAdded" (click)="onBtnClick()">
              + {{ actionText }}
            </button>

            <div class="added-state" *ngIf="actionText && (isAdded || isAnimatingAdded)">
              <span class="badge status-answered">
                <span class="checkmark">✓</span> Добавлено в мои ду‘а
              </span>
            </div>
          </div>

          <button class="icon-btn share-btn" aria-label="Поделиться" (click)="onShare()"
            title="Поделиться в Telegram/Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>

        <!-- User Dua interactions -->
        <div class="right-footer" *ngIf="!actionText && !hideAnswerAction">
          <button *ngIf="!isAnswered && !isAnimating" class="mark-answered-btn" (click)="onMarkAnswered()">
            ✓ Ответить
          </button>
          <span class="badge status-answered" *ngIf="isAnswered || isAnimating">
            <span class="checkmark">✓</span> Отвечено
          </span>
        </div>
      </div>
    </div>

    <!-- BACK SIDE -->
    <div class="dua-card-face dua-card-back dua-card" *ngIf="textAr" [class.main-card]="isMain"
      [class.exporting]="isExporting">
      <div class="card-content back-content">
        <p class="dua-text-ar">{{ textAr }}</p>
        <p class="dua-transcription" *ngIf="transcription">{{ transcription }}</p>
        <p class="dua-ref" *ngIf="reference">{{ reference }}</p>
        <p class="flip-hint" *ngIf="!isExporting">Нажмите, чтобы вернуться</p>
      </div>
    </div>

  </div>
</div>
