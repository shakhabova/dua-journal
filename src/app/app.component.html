<div class="app-container">
  <!-- Top Header based on mockup -->
  <header class="app-header">
    <div class="header-content container">
      <h1 class="logo">
        Личное пространство ду‘а
        <button class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Включить светлую тему' : 'Включить темную тему'">
          <span class="icon">{{ isDark() ? '☀️' : '🌙' }}</span>
        </button>
      </h1>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-navbar></app-navbar>
</div>
